<script>
/* ===== ÉCRANS 10 à 12 : assistant, analyse de photo, profil ===== */
const STAGE_TIP={'Semis':'Garder le sol légèrement humide, sans le détremper.','Levée':'Arrosages légers et réguliers, protéger les jeunes plants du soleil fort.','Croissance végétative':'Arrosage régulier, désherbage et apport de matière organique si besoin.','Floraison':'Éviter tout manque d’eau : il peut faire chuter fleurs et rendement.','Fructification':'Arrosage régulier et profond, surveiller maladies et ravageurs.','Maturité':'Réduire progressivement l’eau selon la culture, préparer la récolte.','Récolte':'Récolter aux heures fraîches et trier les produits abîmés.'};
function findCrop(txt){return S.crops.find(c=>txt.includes(c.name.toLowerCase()))}
function calendarFor(c){const d=Math.round(c.water*c.area);
  return`Calendrier d’entretien proposé pour ${c.name}${c.variety?' ('+c.variety+')':''}, stade « ${c.stage} » :\n\n• Chaque jour : vérifier l’humidité du sol à 5-10 cm avant d’arroser. Besoin indicatif : environ ${d} L par jour pour ${c.area} m² (d’après vos réglages).\n• 2 fois par semaine : parcourir la parcelle et noter l’état des feuilles.\n• 1 fois par semaine : désherber et contrôler le paillage.\n• Toutes les 2 semaines : photographier quelques plants repères pour comparer.\n• Au changement de stade : mettre à jour le stade dans l’application.\n\nConseil du stade : ${STAGE_TIP[c.stage]||''}\n\nCe calendrier est général. Adaptez-le à la pluie, au sol et aux conseils d’un technicien local.`}
function sensorTalk(){
  if(!isSim())return'Aucun capteur n’est connecté, donc je n’ai aucune mesure réelle à interpréter. Si vous me donnez une mesure que vous avez prise vous-même (par exemple l’état du sol à 5 cm de profondeur), je peux vous aider à la comprendre.';
  const s=Math.round(L.soil),w=Math.round(L.water);
  return`Voici les valeurs actuelles, qui sont SIMULÉES et non réelles :\n• Sol : ${s} %. ${s<30?'Valeur basse : un sol sec est probable.':s>75?'Valeur élevée : sol très humide.':'Valeur intermédiaire.'}\n• Air : ${tC(L.temp)} ${tU()}, ${Math.round(L.hum)} % d’humidité.\n• Réserve d’eau : ${w} %.\n\nAvec de vrais capteurs, les seuils dépendent du sol, de la culture et du calibrage du capteur. Pour quelle culture souhaitez-vous interpréter ces valeurs ?`}
function botReply(text){
  const q=text.toLowerCase(),c=findCrop(q),P=UI.pending;UI.pending=null;
  if(P==='calendar'&&c)return{text:calendarFor(c)};
  if(P==='calendar'&&!c)return{text:'Je ne trouve pas cette culture dans votre liste. Ajoutez-la dans l’onglet Cultures, puis redemandez le calendrier.'};
  if(/calendrier|planning|entretien|programme d.entretien/.test(q)){
    if(c)return{text:calendarFor(c)};
    if(!S.crops.length)return{text:'Ajoutez d’abord une culture pour que je puisse préparer un calendrier adapté.'};
    UI.pending='calendar';return{text:'Pour quelle culture ? Vous avez : '+S.crops.map(x=>x.name).join(', ')+'.'}}
  if(/capteur|mesure|donn[ée]e|humidit[ée]|valeur/.test(q))return{text:sensorTalk()};
  if(/arros|irrig|eau|pompe/.test(q)){
    const need=c?`Pour ${c.name} (${c.stage}), votre réglage indique ${c.water} L/m²/jour, soit environ ${Math.round(c.water*c.area)} L par jour sur ${c.area} m².\n\n`:'';
    return{text:need+'Règles simples : arrosez selon l’humidité du sol plutôt qu’à heure fixe, tôt le matin ou en fin de journée, et plutôt en profondeur et moins souvent. Enfoncez un doigt à 5-10 cm : si c’est sec, arrosez.\n\nPour affiner, dites-moi : la culture, son stade, le type de sol (sableux, argileux) et s’il a plu ces derniers jours.'}}
  if(/maladie|feuille|jaun|tache|ravageur|insecte|fl[ée]tri|pourri|champignon|probl[èe]me|bizarre|malade/.test(q))
    return{text:'Je ne peux pas poser de diagnostic fiable à partir d’une description. Pour avancer, j’aurais besoin de savoir :\n• Quelle plante, et quelle partie est touchée (feuilles basses, jeunes pousses, fruits, tige) ?\n• Depuis combien de jours, et est-ce que ça s’étend ?\n• Combien et quand arrosez-vous ? Les plantes voisines sont-elles touchées ?\n• Voyez-vous des insectes ?\n\nVous pouvez aussi utiliser l’analyse guidée par photo. Si plusieurs plants sont atteints ou si cela progresse vite, demandez l’avis d’un technicien agricole.',go:'photo'};
  if(/bonjour|salut|manao ahoana|hello/.test(q))return{text:'Bonjour ! Posez-moi une question sur l’arrosage, vos capteurs, une culture ou un problème sur une plante.'};
  return{text:'Je ne suis pas sûr de pouvoir répondre correctement à cette question. Pouvez-vous préciser la culture, son stade et ce que vous observez ? Pour une décision importante (traitement, semis à grande échelle), consultez un technicien agricole de votre région.'}}
SCREENS.assistant=()=>{
  if(!UI.chat.length)UI.chat.push({who:'bot',text:'Bonjour ! Je suis l’assistant TANTSAVA. Je peux expliquer vos données, donner des conseils d’arrosage, préparer un calendrier d’entretien ou vous guider si une plante va mal. Si je manque d’informations, je vous poserai des questions.'});
  return`<div class="stack" style="padding-bottom:70px"><div class="row between"><h1>${t('assistant')}</h1></div>
  ${banner('<b>Assistant local.</b> Les réponses sont préprogrammées à partir de règles agricoles générales et de vos données. Aucun service d’IA en ligne n’est connecté pour l’instant (clé d’API et abonnement nécessaires).','info','alert')}
  <div class="chips">${[['Comprendre mes capteurs'],['Conseil d’arrosage'],['Calendrier d’entretien'],['J’ai un problème sur une plante']].map(([x])=>`<button class="chip" data-act="quick" data-q="${esc(x)}">${x}</button>`).join('')}</div>
  <div class="chat" aria-live="polite">${UI.chat.map(m=>`<div class="msg ${m.who}">${esc(m.text)}${m.go?`<div style="margin-top:10px"><button class="btn sm" data-go="photo">${ic('camera')}Analyse guidée par photo</button></div>`:''}</div>`).join('')}${UI.typing?'<div class="msg bot"><span class="spin"></span></div>':''}</div></div>
  <div class="composer"><form data-form="chat"><input id="chatin" type="text" placeholder="Votre question…" aria-label="Votre question" autocomplete="off"><button class="btn" type="submit" aria-label="Envoyer">${ic('send')}</button></form></div>`};
function sendChat(text){if(!text||UI.typing)return;UI.chat.push({who:'me',text});UI.typing=true;render();scrollEnd();
  setTimeout(()=>{UI.typing=false;const r=botReply(text);UI.chat.push({who:'bot',text:r.text,go:r.go});render();scrollEnd()},700)}
const scrollEnd=()=>{window.scrollTo(0,document.body.scrollHeight);const i=$('#chatin');if(i&&UI.screen==='assistant')i.focus({preventScroll:true})};
FORMS.chat=f=>{const i=$('#chatin',f),v=i.value.trim();i.value='';sendChat(v)};
ACT.quick=el=>sendChat(el.dataset.q);

/* 11. Analyse d'une plante par photo (guidée, sans modèle d'image) */
const SYMP={jaun:['Feuilles jaunies',['Manque ou excès d’eau','Manque d’éléments nutritifs (azote notamment)','Mauvais drainage ou racines abîmées','Vieillissement naturel des feuilles basses','Début de maladie']],
 tache:['Taches brunes ou noires',['Maladie due à un champignon ou à une bactérie','Brûlure due au soleil ou à l’eau sur les feuilles','Éclaboussures de terre après la pluie']],
 flet:['Plante flétrie',['Manque d’eau','Excès d’eau qui étouffe les racines','Maladie des racines ou de la tige','Attaque d’insectes sur les racines']],
 enrou:['Feuilles enroulées ou déformées',['Chaleur ou stress hydrique','Insectes piqueurs (pucerons, aleurodes)','Maladie virale possible']],
 trou:['Feuilles trouées ou rongées',['Chenilles, limaces ou criquets','Autres insectes mangeurs de feuilles']],
 poudre:['Poudre blanche ou duvet',['Maladie fongique de type oïdium ou mildiou possible','Air trop humide et peu aéré']],
 pourr:['Fruit ou tige qui pourrit',['Excès d’humidité','Champignon ou bactérie','Manque de calcium ou arrosage irrégulier (fruits)']],
 lent:['Croissance ralentie',['Manque d’eau ou de nutriments','Sol tassé ou pauvre','Chaleur ou froid inhabituel']],
 insect:['Insectes visibles',['À identifier avant tout traitement : certains insectes sont utiles']]};
const newPhoto=crop=>({img:'',crop:crop||'',sym:[],where:'',days:'',water:'',nb:'',result:null});
UI.photo=newPhoto();
const sel=(k,opts,cur)=>`<div class="field"><label for="p-${k}">${opts[0]}</label><select id="p-${k}" data-change="pinfo" data-k="${k}"><option value="">Je ne sais pas</option>${opts.slice(1).map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
SCREENS.photo=()=>{
  const p=UI.photo,r=p.result;
  return`<div class="stack">${topbar('Analyse d’une plante')}
  ${banner('<b>Ce n’est pas un diagnostic.</b> Aucun modèle d’analyse d’image n’est intégré : votre photo n’est pas interprétée. Elle sert de trace. Les pistes ci-dessous viennent uniquement de vos réponses.','warn')}
  <div class="card stack"><div class="thumb big" id="pv">${p.img?`<img src="${p.img}" alt="Photo choisie">`:ic('camera')}</div>
   <div class="field"><label for="pfile">Prendre ou choisir une photo</label><input id="pfile" type="file" accept="image/*" capture="environment" data-change="pfile"></div>
   <div class="field"><label for="pcrop">Culture concernée</label><select id="pcrop" data-change="pinfo" data-k="crop"><option value="">Aucune en particulier</option>${S.crops.map(c=>`<option value="${c.id}" ${p.crop===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  <div class="card stack8"><h3>Qu’observez-vous ?</h3>${Object.entries(SYMP).map(([k,v])=>`<label class="check ${p.sym.includes(k)?'on':''}" style="margin:0;font-weight:500"><input type="checkbox" data-change="sym" data-k="${k}" ${p.sym.includes(k)?'checked':''}>${v[0]}</label>`).join('')}</div>
  <div class="card stack">${sel('where',['Où sur la plante ?','Feuilles du bas','Jeunes pousses','Partout','Fruits ou tige'],p.where)}${sel('days',['Depuis combien de temps ?','Moins de 3 jours','3 à 7 jours','Plus d’une semaine'],p.days)}${sel('water',['Comment arrosez-vous ?','Plutôt trop','Plutôt pas assez','Régulièrement, comme il faut'],p.water)}${sel('nb',['Les plantes voisines sont-elles touchées ?','Oui, plusieurs','Non, une seule','Un peu'],p.nb)}</div>
  <button class="btn" data-act="analyze">Voir les pistes prudentes</button>
  ${r?resultHtml(r,p):''}</div>`};
function resultHtml(r,p){return`<div class="card stack" id="res"><h2>Pistes à vérifier</h2>
  <div><h3>Symptômes que vous signalez</h3><p class="small">${r.obs.length?r.obs.join(', '):'Aucun symptôme coché.'}</p></div>
  <div><h3>Causes possibles</h3><ul class="small stack8" style="margin:6px 0 0;padding-left:18px">${r.causes.map(x=>`<li>${x}</li>`).join('')||'<li>Pas assez d’éléments pour proposer des pistes.</li>'}</ul></div>
  <div class="row between"><h3>Incertitude</h3>${pill(r.unc,r.unc==='Élevée'?'warn':'info')}</div>
  <div><h3>Informations utiles en plus</h3><ul class="small stack8" style="margin:6px 0 0;padding-left:18px">${r.need.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div><h3>Mesures de prudence</h3><ul class="small stack8" style="margin:6px 0 0;padding-left:18px">${r.prev.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  ${banner(r.spec,r.urgent?'err':'info')}
  <button class="btn ghost" data-act="savephoto">Enregistrer dans l’historique${p.crop?'':' (choisissez une culture)'}</button></div>`}
CHG.pfile=async el=>{const f=el.files[0];if(!f)return;try{UI.photo.img=await readImage(f,480);render()}catch(e){toast('Cette image n’a pas pu être lue.',true)}};
CHG.pinfo=el=>{UI.photo[el.dataset.k]=el.value;UI.photo.result=null;render()};
CHG.sym=el=>{const p=UI.photo,k=el.dataset.k;p.sym=el.checked?[...p.sym,k]:p.sym.filter(x=>x!==k);p.result=null;render()};
ACT.analyze=()=>{
  const p=UI.photo;if(!p.sym.length){toast('Cochez au moins un symptôme observé.',true);return}
  const causes=[...new Set(p.sym.flatMap(k=>SYMP[k][1]))],answered=['where','days','water','nb'].filter(k=>p[k]).length;
  const need=[];if(!p.where)need.push('La partie de la plante touchée.');if(!p.days)need.push('Depuis quand le symptôme est apparu.');if(!p.water)need.push('Votre rythme d’arrosage.');if(!p.nb)need.push('Si les plantes voisines sont touchées.');
  need.push('Le type de sol et la météo récente (pluie, chaleur).','Une photo de près de la feuille, dessus et dessous.');
  const urgent=p.nb==='Oui, plusieurs'||p.sym.includes('flet')&&p.days==='Moins de 3 jours';
  p.result={obs:p.sym.map(k=>SYMP[k][0].toLowerCase()),causes,unc:(answered>=3&&p.sym.length<=2)?'Moyenne':'Élevée',need,urgent,
   prev:['Vérifiez l’humidité du sol à 5-10 cm avant d’arroser, sans arroser le feuillage.','Retirez et isolez les feuilles très atteintes. Ne les mettez pas au compost si vous suspectez une maladie.','Aérez la parcelle : espacez, taillez ou tuteurez pour que l’air circule.','Observez 2 à 3 jours et photographiez la même plante chaque jour.','N’appliquez aucun produit avant d’avoir identifié le problème. Si vous en utilisez un, suivez l’étiquette et protégez-vous.'],
   spec:urgent?'<b>Avis d’un technicien conseillé rapidement.</b> Plusieurs plantes touchées ou un flétrissement soudain peuvent annoncer un problème qui s’étend.':'Si les symptômes s’aggravent, touchent plusieurs plants ou persistent plus d’une semaine, consultez un technicien agricole de votre région.'};
  render();setTimeout(()=>{const e=$('#res');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},50)};
ACT.savephoto=()=>{const p=UI.photo,c=cropById(p.crop);if(!c){toast('Choisissez d’abord la culture concernée.',true);return}
  const txt='Analyse guidée : '+p.result.obs.join(', ')+'. Incertitude '+p.result.unc.toLowerCase()+'.';const h=p.result.urgent?'Préoccupant':'À surveiller';
  c.obs.push({id:uid(),ts:Date.now(),text:txt,health:h});c.health=h;if(p.img)c.photo=p.img;
  if(p.result.urgent)addEvent('plant','Symptôme inquiétant : '+c.name,'Demander l’avis d’un technicien agricole et isoler les plants touchés.','high',txt);
  save();toast('Enregistré dans l’historique de '+c.name+'.');go('cropdetail',{id:c.id},false)};

/* 12. Profil et paramètres */
SCREENS.profile=()=>{
  const st=S.settings,u=S.user||{},n=st.notif,NL={soil:'Sol trop sec',water:'Niveau d’eau insuffisant',sensor:'Capteur déconnecté',temp:'Température inhabituelle',cmd:'Échec de commande d’irrigation',plant:'Symptôme inquiétant sur une plante'};
  return`<div class="stack"><h1>${t('profile')}</h1>
  <div class="card row"><div class="thumb" style="border-radius:50%">${ic('user')}</div><div class="grow"><b>${esc(u.name||'')}</b><p class="small muted">${u.demo?'Compte de démonstration':esc(u.ident||'')}</p></div></div>
  <div class="card stack8"><div class="row between"><h3>Mon exploitation</h3><button class="btn sm ghost" data-act="farmform">Modifier</button></div>
   <p>${esc(S.farm.name||'—')}</p><p class="small muted">${esc(S.farm.type||'')} · ${S.farm.loc?esc(S.farm.loc):'Localisation non renseignée (facultatif)'}</p></div>
  <div class="card stack"><h3>Préférences de notification</h3>${Object.keys(NL).map(k=>`<label class="row between" style="margin:0;font-weight:500"><span>${NL[k]}</span><span class="sw"><input type="checkbox" data-change="notif" data-k="${k}" ${n[k]?'checked':''}><span></span></span></label>`).join('')}</div>
  <div class="card stack"><h3>Langue et unités</h3>
   <div class="field"><label for="lang">Langue</label><select id="lang" data-change="pref" data-k="lang"><option value="fr" ${st.lang==='fr'?'selected':''}>Français</option><option value="mg" ${st.lang==='mg'?'selected':''}>Malagasy (traduction en préparation)</option></select></div>
   <div class="grid2"><div class="field"><label for="tu">Température</label><select id="tu" data-change="pref" data-k="tempUnit"><option value="C" ${st.tempUnit==='C'?'selected':''}>°C</option><option value="F" ${st.tempUnit==='F'?'selected':''}>°F</option></select></div>
   <div class="field"><label for="au">Surface</label><select id="au" data-change="pref" data-k="areaUnit"><option value="m2" ${st.areaUnit==='m2'?'selected':''}>m²</option><option value="ares" ${st.areaUnit==='ares'?'selected':''}>ares</option><option value="ha" ${st.areaUnit==='ha'?'selected':''}>hectares</option></select></div></div></div>
  <div class="card stack8"><h3>Sécurité</h3><p class="small muted">Le compte et les données sont enregistrés sur cet appareil. Une connexion sécurisée en ligne et la sauvegarde demandent Firebase ou une API.</p>
   ${u.demo?'':'<button class="btn ghost" data-act="pwform">Changer le mot de passe</button>'}<button class="btn ghost" data-act="wipe" style="color:var(--err)">Effacer les données de cet appareil</button></div>
  <button class="btn deep" data-act="logout">Déconnexion</button><p class="tiny muted" style="text-align:center">TANTSAVA · prototype 0.1 · ${isSim()?'données fictives (simulation)':'mode réel'}</p></div>`};
CHG.notif=el=>{S.settings.notif[el.dataset.k]=el.checked;save()};
CHG.pref=el=>{S.settings[el.dataset.k]=el.value;save();if(el.dataset.k==='lang'&&el.value==='mg')toast('Le malgache est en préparation : le français est utilisé pour les textes manquants.');render()};
Object.assign(ACT,{
  farmform(){const f=S.farm;openSheet(`<form class="stack" data-form="farm" novalidate><div class="row between"><h2>Mon exploitation</h2><button type="button" class="iconbtn" data-act="closesheet" aria-label="Fermer">${ic('x')}</button></div>
   ${field('fname','Nom de l’exploitation','text',f.name)}${field('floc','Localisation (facultatif)','text',f.loc,'placeholder="Ex. Antsirabe"')}
   <div class="field"><label for="ftype">Type</label><select id="ftype">${['Petite exploitation','Agriculture urbaine','Rizière','Maraîchage','Autre'].map(x=>`<option ${x===f.type?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" type="submit">Enregistrer</button></form>`)},
  pwform(){openSheet(`<form class="stack" data-form="pw" novalidate><div class="row between"><h2>Changer le mot de passe</h2><button type="button" class="iconbtn" data-act="closesheet" aria-label="Fermer">${ic('x')}</button></div>${field('old','Mot de passe actuel','password')}${field('new1','Nouveau mot de passe (8 caractères minimum)','password')}<button class="btn" type="submit">Enregistrer</button></form>`)},
  wipe(){openSheet(`<div class="stack"><h2>Effacer les données ?</h2><p>Compte, cultures, observations et historique seront supprimés de cet appareil. Cette action est définitive.</p><button class="btn danger" data-act="wipe2">Tout effacer</button><button class="btn ghost" data-act="closesheet">Annuler</button></div>`)},
  wipe2(){try{localStorage.removeItem(LS)}catch(e){}S=seedState();Object.assign(PUMP,{on:false});initLive();closeSheet();UI.chat=[];go('auth',{},false);toast('Données effacées.')},
  logout(){S.session=false;PUMP.on=false;save();UI.stack=[];go('auth',{},false)}});
FORMS.farm=f=>{const n=$('#fname',f).value.trim();if(!n){setErr('fname','Donnez un nom à votre exploitation.');return}S.farm={name:n,loc:$('#floc',f).value.trim(),type:$('#ftype',f).value};save();closeSheet();toast('Exploitation enregistrée.');render()};
FORMS.pw=async f=>{const o=$('#old',f).value,n=$('#new1',f).value;setErr('old','');setErr('new1','');
  if(await hashPw(o,S.user.salt)!==S.user.hash){setErr('old','Mot de passe actuel incorrect.');return}
  if(n.length<8){setErr('new1','Au moins 8 caractères.');return}
  S.user.salt=uid()+uid();S.user.hash=await hashPw(n,S.user.salt);save();closeSheet();toast('Mot de passe modifié.')};
</script>
<script>
/* ===== NAVIGATION, ÉVÉNEMENTS, DÉMARRAGE ===== */
const NAV=[['dashboard','home','home'],['crops','leaf','crops'],['sensors','chart','data'],['assistant','chat','assistant'],['profile','user','profile']];
function navHtml(){const cur=PARENT[UI.screen]||UI.screen;
  return`<div class="nav"><div class="in" role="navigation" aria-label="Navigation principale">${NAV.map(([s,i,l])=>`<button data-nav="${s}" class="${cur===s?'on':''}" ${cur===s?'aria-current="page"':''}>${ic(i)}<span>${t(l)}</span></button>`).join('')}</div></div>`}
function go(screen,params={},push=true){
  if(push&&!['splash','auth'].includes(UI.screen))UI.stack.push({screen:UI.screen,params:UI.params});else if(!push)UI.stack=[];
  UI.screen=screen;UI.params=params||{};
  if(screen==='photo')UI.photo=newPhoto(params&&params.id);
  if(screen==='cropdetail')UI.cropTab='infos';
  closeSheet();render(true)}
function back(){const p=UI.stack.pop();if(p){UI.screen=p.screen;UI.params=p.params}else{UI.screen='dashboard';UI.params={}}render(true)}
let lastScreen='';
function render(top){
  if(!S)return;const y=window.scrollY;
  if(UI.screen!=='splash'&&!S.session)UI.screen='auth';
  const main=S.session&&!['splash','auth'].includes(UI.screen),fn=SCREENS[UI.screen]||SCREENS.dashboard;
  $('#app').innerHTML=fn();$('#nav').innerHTML=main?navHtml():'';
  const stay=lastScreen===UI.screen&&!top;lastScreen=UI.screen;window.scrollTo(0,stay?y:0)}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,{id:g.dataset.id,crop:g.dataset.crop});return}
  const n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav,{},false);return}
  const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
  if(k==='sheetbg'){if(e.target===a)closeSheet();return}
  if(k==='back'){back();return}
  if(ACT[k])ACT[k](a,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card.link[role=button]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape')closeSheet()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const fn=CHG[el.dataset.change];if(fn)fn(el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(!el)return;const fn=INP[el.dataset.input];if(fn)fn(el)});
CHG.stage=el=>{const c=cropById(UI.params.id);if(!c)return;c.stage=el.value;(c.log=c.log||[]).push({ts:Date.now(),text:'Stade : '+el.value});save();toast('Stade mis à jour : '+el.value);render()};

(function boot(){
  const nav=document.createElement('div');nav.id='nav';document.body.appendChild(nav);
  S=loadState();
  if(!S||!S.v||!S.settings)S=seedState();
  S.read=S.read||{};S.events=S.events||[];S.histReal=S.histReal||[];S.irrReal=S.irrReal||[];S.farm=S.farm||{name:'Ma ferme',loc:'',type:'Petite exploitation'};
  if(!S.hist.length||S.hist[S.hist.length-1].ts<Date.now()-6*H){const f=seedState();S.hist=f.hist;S.irr=S.irr.filter(i=>!i.demo).concat(f.irr)}
  initLive();save();
  UI.screen='splash';render(true);
  setInterval(tick,5000);
  setTimeout(()=>{UI.screen=S.session?'dashboard':'auth';render(true)},1700);
})();
</script>
<script>
/* ===== PWA : installation, hors ligne, mises à jour ===== */
(function(){
  var evt=null,ua=navigator.userAgent||'';
  var standalone=function(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true};
  var ios=/iphone|ipad|ipod/i.test(ua);
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;if(UI.screen==='profile')render()});
  window.addEventListener('appinstalled',function(){evt=null;toast('TANTSAVA est installée sur votre téléphone.');if(UI.screen==='profile')render()});
  function card(){
    if(standalone())return '<div class="card tint row">'+ic('check')+'<div class="grow"><b>Application installée</b><p class="small muted">Vous utilisez TANTSAVA en plein écran.</p></div></div>';
    var how=evt?'<button class="btn" data-act="pwainstall">Installer l’application</button>'
      :ios?'<p class="small">Sur iPhone : ouvrez ce site dans Safari, touchez le bouton Partager, puis « Sur l’écran d’accueil ».</p>'
      :'<p class="small">Dans le menu ⋮ de Chrome, choisissez « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p>';
    return '<div class="card stack8"><h3>Installer sur ce téléphone</h3><p class="small muted">L’application s’ouvre en plein écran, avec son icône, et fonctionne aussi sans internet.</p>'+how+'</div>';
  }
  ACT.pwainstall=function(){
    if(!evt)return;evt.prompt();
    evt.userChoice.then(function(c){if(c.outcome==='accepted')toast('Installation en cours…');evt=null;render()});
  };
  var origProfile=SCREENS.profile;
  SCREENS.profile=function(){
    var html=origProfile(),mark='<button class="btn deep" data-act="logout">';
    return html.indexOf(mark)>-1?html.replace(mark,card()+mark):html;
  };
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){
      var had=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function(){});
      navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)toast('Mise à jour installée. Elle sera active au prochain lancement.')});
    });
  }
  window.addEventListener('offline',function(){toast('Vous êtes hors ligne. Vos données restent sur ce téléphone.')});
  window.addEventListener('online',function(){toast('Connexion rétablie.')});
})();
</script>
