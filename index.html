<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TANTSAVA</title>
<meta name="description" content="TANTSAVA : l'agriculture intelligente, accessible à tous. Suivi des cultures, capteurs, irrigation et conseils.">
<meta name="theme-color" content="#245C32">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TANTSAVA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first app shell, 480px column, fixed bottom nav, sheets for forms.
   Tokens: palette from the TANTSAVA brief; display = Bricolage Grotesque, body = Figtree. */
:root{
  --bg:#F7F9F4;--card:#FFFFFF;--line:#D9E2D5;--fg:#202820;--fg2:#59635A;
  --brand:#81CD4B;--deep:#245C32;--leaf:#60C771;--lime:#CEE31C;
  --err:#DC2626;--info:#2563EB;--warn:#B45309;--ok:#1F7A3A;
  --on-brand:#17351D;--head:#245C32;--tint:#EAF4E0;--tint-err:#FDECEC;--tint-warn:#FFF3DC;--tint-info:#E8EFFD;
  --c-soil:#2F7D3F;--c-temp:#E07B1A;--c-hum:#1E88C8;--c-water:#5B6EE1;
  --shadow:0 1px 2px rgba(36,92,50,.08),0 4px 14px rgba(36,92,50,.06);
  --fd:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111812;--card:#1A241C;--line:#2E3C30;--fg:#E7EFE4;--fg2:#A2B0A4;
  --err:#F87171;--info:#7FA8FF;--warn:#F5B454;--ok:#7BDC93;
  --on-brand:#14301B;--head:#A9E27F;--tint:#22321F;--tint-err:#3A1E1E;--tint-warn:#3A2D14;--tint-info:#1C2740;
  --c-soil:#7DD87F;--c-temp:#F29A4A;--c-hum:#62B5EC;--c-water:#97A4F5;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111812;--card:#1A241C;--line:#2E3C30;--fg:#E7EFE4;--fg2:#A2B0A4;
  --err:#F87171;--info:#7FA8FF;--warn:#F5B454;--ok:#7BDC93;
  --on-brand:#14301B;--head:#A9E27F;--tint:#22321F;--tint-err:#3A1E1E;--tint-warn:#3A2D14;--tint-info:#1C2740;
  --c-soil:#7DD87F;--c-temp:#F29A4A;--c-hum:#62B5EC;--c-water:#97A4F5;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding-block:12px 96px;min-height:100vh}
h1,h2,h3{font-family:var(--fd);color:var(--head);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:26px;font-weight:800}h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--fg2)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}.stack8{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.tint{background:var(--tint);border-color:transparent;box-shadow:none}
.card.link{cursor:pointer}
.card.link:active{transform:scale(.99)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;font:600 16px var(--fb);cursor:pointer;background:var(--brand);color:var(--on-brand);width:100%;text-align:center}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--head)}
.btn.deep{background:var(--deep);color:#fff}
.btn.danger{background:var(--err);color:#fff}
.btn.sm{min-height:44px;width:auto;font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card.link:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--head);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--head);white-space:nowrap}
.pill.err{background:var(--tint-err);color:var(--err)}.pill.warn{background:var(--tint-warn);color:var(--warn)}.pill.info{background:var(--tint-info);color:var(--info)}
.pill.sim{background:var(--lime);color:#2E3A05}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:16px var(--fb);padding:0 14px}
textarea{padding:12px 14px;min-height:96px;resize:vertical}
input[type=range]{padding:0;min-height:32px;accent-color:var(--deep)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--deep)}
.field.err input,.field.err select{border-color:var(--err)}
.errmsg{color:var(--err);font-size:13px;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:600 14px var(--fb);cursor:pointer}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar h1{font-size:22px;flex:1;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--leaf);transition:width .4s}
.bar.water i{background:var(--c-water)}
.metric{display:flex;flex-direction:column;gap:6px}
.metric .v{font:800 28px var(--fd);color:var(--fg);font-variant-numeric:tabular-nums;line-height:1}
.metric .v small{font-size:14px;font-weight:600;color:var(--fg2);margin-left:2px}
.metric .l{display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:13px;font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;font-size:13.5px;background:var(--tint-info);color:var(--fg)}
.banner.warn{background:var(--tint-warn)}.banner.err{background:var(--tint-err)}.banner.sim{background:var(--lime);color:#2E3A05}
.banner svg{margin-top:1px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;border-radius:12px;min-height:56px;color:var(--fg2);font:600 11.5px var(--fb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.nav button.on{color:var(--head);background:var(--tint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--deep);color:#fff;border-radius:12px;padding:12px 16px;max-width:min(440px,calc(100vw - 32px));font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--err)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:12px;background:var(--tint);color:var(--head);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.big{width:100%;height:170px;border-radius:14px}
.alert{border-left:4px solid var(--info);padding-left:12px}
.alert.high{border-color:var(--err)}.alert.med{border-color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg2);font:11px var(--fb)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:var(--on-brand);align-self:flex-end;border-bottom-right-radius:4px}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--bg);z-index:15}
.composer form{max-width:480px;margin:0 auto;display:flex;gap:8px}
.composer input{flex:1}
.composer .btn{width:52px;padding:0}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;position:relative;overflow:hidden;padding-block:40px}
.splash .leaf{position:absolute;opacity:.5;pointer-events:none}
.logo{width:92px;height:92px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--deep);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;min-height:48px}
.check.on{border-color:var(--deep);background:var(--tint)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;color:var(--fg2);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--deep)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.nav button{font-size:11px;padding-inline:2px;white-space:nowrap}
@media (display-mode:standalone){html{overscroll-behavior-y:contain}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* ===== CORE : utilitaires, textes, état, données de démonstration ===== */
const LS='tantsava.v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const H=3600e3,DAY=24*H;

/* Textes : le français est complet, le malgache se complète ici sans toucher au reste du code. */
const T={fr:{
  home:'Accueil',crops:'Cultures',data:'Données',assistant:'Assistant IA',profile:'Profil',
  hello:'Bonjour',sim:'Mode simulation',real:'Mode réel',slogan:'L’agriculture intelligente, accessible à tous',
  soil:'Humidité du sol',temp:'Température',hum:'Humidité de l’air',water:'Niveau d’eau'},
  mg:{home:'Fandraisana',crops:'Voly',data:'Angona',profile:'Mombamomba'}};
const t=k=>{const l=S&&S.settings?S.settings.lang:'fr';return(T[l]&&T[l][k])||T.fr[k]||k};

const STAGES=['Semis','Levée','Croissance végétative','Floraison','Fructification','Maturité','Récolte'];
const TIPS={
 tomate:['Arroser au pied, tôt le matin, en évitant de mouiller le feuillage.','Un arrosage régulier limite l’éclatement des fruits et la pourriture apicale.','Pailler le sol pour garder l’humidité et limiter les mauvaises herbes.','Tuteurer les plants et retirer les feuilles qui touchent le sol.'],
 riz:['Maintenir une lame d’eau adaptée au stade, sans laisser la parcelle se dessécher.','Surveiller le niveau d’eau après de fortes pluies pour éviter l’inondation des jeunes plants.','Drainer la parcelle quelques jours avant la récolte.','Désherber tôt : la concurrence est la plus forte en début de cycle.'],
 laitue:['Arrosages légers et fréquents : les racines sont peu profondes.','Au-dessus d’environ 25 °C la laitue monte en graines plus vite. Prévoir de l’ombrage aux heures chaudes.','Récolter le matin pour une meilleure conservation.'],
 manioc:['Le manioc supporte les périodes sèches mais pas l’eau stagnante.','Désherber pendant les trois premiers mois.','Planter sur sol bien drainé ou en buttes.'],
 haricot:['Arroser régulièrement à la floraison : un manque d’eau fait chuter les fleurs.','Éviter d’arroser le feuillage en fin de journée.','Faire une rotation avec une culture d’une autre famille.'],
 defaut:['Observer la plante chaque semaine et noter les changements.','Arroser selon l’humidité du sol plutôt que selon un horaire fixe.','Garder un peu de paillage pour limiter l’évaporation.']};
const tipsFor=n=>{const k=String(n||'').toLowerCase();return TIPS[Object.keys(TIPS).find(x=>x!=='defaut'&&k.includes(x))||'defaut']};

let S=null;           // état persistant
const L={soil:0,temp:0,hum:0,water:0,ts:0,conn:{soil:true,temp:true,hum:true,water:true}}; // mesures en direct (simulation)
const PUMP={on:false,since:0,runMin:0,liters:0,source:'',limitMin:0,crop:''};
const UI={screen:'splash',params:{},stack:[],busy:false,chat:[],cropTab:'infos',statsRange:'24h',statsCrop:'all',statsTab:'sol',dashSeries:'soil'};

function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadState(){try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r)}catch(e){}return null}

function seedState(){
  const now=Date.now(),r=rng(2026),hist=[];
  for(let i=167;i>=0;i--){
    const ts=now-i*H,h=new Date(ts).getHours(),ph=(h-9)/24*2*Math.PI;
    hist.push({ts,soil:+clamp(63-((h-6+24)%24)*0.9+3*Math.sin(i/24*2)+(r()-.5)*2,18,90).toFixed(1),
      temp:+(21+7*Math.sin(ph)+(r()-.5)*1.2).toFixed(1),hum:+clamp(72-14*Math.sin(ph)+(r()-.5)*3,25,98).toFixed(1),
      water:+clamp(82-(167-i)*.13+(r()-.5),0,100).toFixed(1)});
  }
  const irr=[];
  for(let d=6;d>=0;d--){const dt=new Date(now-d*DAY);dt.setHours(6,0,0,0);const m=10+Math.floor(r()*8);
    irr.push({id:uid(),start:dt.getTime(),minutes:m,liters:m*4,source:d%2?'Programme':'Manuel',crop:d%3===0?'c2':'c1',result:'ok',demo:true})}
  const crops=[
   {id:'c1',name:'Tomate',variety:'Roma',plantDate:iso(now-38*DAY),area:120,water:4,stage:'Floraison',health:'Bon',photo:'',demo:true,
    obs:[{id:uid(),ts:now-3*DAY,text:'Premières fleurs sur le deuxième bouquet.',health:'Bon'},{id:uid(),ts:now-12*DAY,text:'Tuteurage terminé.',health:'Bon'}]},
   {id:'c2',name:'Riz',variety:'X265',plantDate:iso(now-62*DAY),area:800,water:8,stage:'Croissance végétative',health:'Bon',photo:'',demo:true,
    obs:[{id:uid(),ts:now-5*DAY,text:'Tallage régulier, quelques mauvaises herbes sur le bord nord.',health:'À surveiller'}]},
   {id:'c3',name:'Laitue',variety:'Batavia',plantDate:iso(now-21*DAY),area:25,water:3,stage:'Croissance végétative',health:'Bon',photo:'',demo:true,obs:[]}];
  return{v:1,session:false,user:null,
   settings:{lang:'fr',tempUnit:'C',areaUnit:'m2',mode:'sim',notif:{soil:true,water:true,sensor:true,temp:true,cmd:true,plant:true},lockOnOpen:false},
   irrCfg:{auto:false,low:35,high:60,schedules:[{id:uid(),time:'06:00',minutes:10,days:[1,2,3,4,5,6,7],on:true}]},
   estop:false,crops,hist,irr,histReal:[],irrReal:[],events:[],read:{},farm:{name:'Ma ferme',loc:'',type:'Petite exploitation'}};
}
function iso(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* formats */
const fmtDT=ts=>new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtD=ts=>new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const fmtH=ts=>new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'à l’instant';if(m<60)return'il y a '+m+' min';const h=Math.round(m/60);if(h<24)return'il y a '+h+' h';return'il y a '+Math.round(h/24)+' j'};
const tC=c=>S.settings.tempUnit==='F'?+(c*9/5+32).toFixed(1):+(+c).toFixed(1);
const tU=()=>S.settings.tempUnit==='F'?'°F':'°C';
const areaTxt=m2=>{const u=S.settings.areaUnit;if(u==='ares')return+(m2/100).toFixed(2)+' ares';if(u==='ha')return+(m2/10000).toFixed(3)+' ha';return Math.round(m2)+' m²'};
const isSim=()=>S.settings.mode==='sim';
const getHist=()=>isSim()?S.hist:S.histReal;
const getIrr=()=>isSim()?S.irr:S.irrReal;
const cropById=id=>S.crops.find(c=>c.id===id);
const daysSince=d=>Math.max(0,Math.floor((Date.now()-new Date(d+'T00:00:00').getTime())/DAY));

/* icônes */
const IC={home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',leaf:'M5 19c0-9 5-14 15-14 0 10-5 15-14 15M5 19c3-5 6-8 10-10',chart:'M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-3',chat:'M4 5h16v11H9l-5 4z',user:'M12 12a4 4 0 100-8 4 4 0 000 8M4 21c0-4 4-6 8-6s8 2 8 6',bell:'M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4',drop:'M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z',thermo:'M10 14V5a2 2 0 014 0v9a4 4 0 11-4 0z',cloud:'M7 18a4 4 0 010-8 5 5 0 019.5-1A4.5 4.5 0 0117 18z',pump:'M4 12h4m8 0h4M8 7h8v10H8zM12 3v4',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',camera:'M4 8h4l2-3h4l2 3h4v11H4zM12 17a4 4 0 100-8 4 4 0 000 8',send:'M4 12l16-8-6 16-3-7z',alert:'M12 4l9 16H3zM12 10v4M12 17v.5',gear:'M12 15a3 3 0 100-6 3 3 0 000 6M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6l1.4 1.4M6.3 17.7l1.4-1.4m8.6-8.6l1.4-1.4',check:'M5 12l5 5 9-10',power:'M12 3v9M6.5 6.5a8 8 0 1011 0',clock:'M12 21a9 9 0 100-18 9 9 0 000 18M12 7v5l3 2',sprout:'M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6M12 14c0-3-2-5-6-5 0 3 2 5 6 5',x:'M6 6l12 12M18 6L6 18',chev:'M9 5l7 7-7 7',plug:'M9 3v5M15 3v5M7 8h10v4a5 5 0 01-10 0zM12 17v4'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]||''}"/></svg>`;
const logo=(s=92)=>`<svg class="logo" style="width:${s}px;height:${s}px" viewBox="0 0 96 96" role="img" aria-label="Logo TANTSAVA"><rect width="96" height="96" rx="26" fill="#245C32"/><path d="M48 76V46" stroke="#CEE31C" stroke-width="5" stroke-linecap="round"/><path d="M48 50c0-14 9-22 24-22 0 14-9 22-24 22z" fill="#81CD4B"/><path d="M48 58c0-11-7-17-19-17 0 11 7 17 19 17z" fill="#60C771"/><path d="M30 76h36" stroke="#CEE31C" stroke-width="5" stroke-linecap="round"/></svg>`;
</script>
<script>
/* ===== SIMULATION, POMPE, ALERTES, COMPOSANTS ===== */
const LABEL={soil:'Capteur d’humidité du sol',temp:'Capteur de température',hum:'Capteur d’humidité de l’air',water:'Capteur de niveau d’eau'};
function initLive(){const h=S.hist[S.hist.length-1];Object.assign(L,{soil:h.soil,temp:h.temp,hum:h.hum,water:h.water,ts:Date.now()})}
const allConn=()=>L.conn.soil&&L.conn.water;
function addEvent(type,title,action,prio,detail){S.events.unshift({id:uid(),type,ts:Date.now(),title,action,prio:prio||'med',detail:detail||''});if(S.events.length>40)S.events.length=40;save()}

function startPump(source,limit,crop){
  if(S.estop)return{ok:false,msg:'Arrêt d’urgence actif. Relâchez-le pour reprendre.'};
  if(!L.conn.water)return{ok:false,msg:'Capteur de niveau d’eau déconnecté : démarrage refusé par sécurité.'};
  if(L.water<15)return{ok:false,msg:'Niveau d’eau insuffisant ('+Math.round(L.water)+' %). Démarrage refusé.'};
  if(PUMP.on)return{ok:false,msg:'La pompe simulée est déjà en marche.'};
  Object.assign(PUMP,{on:true,since:Date.now(),runMin:0,liters:0,source,limitMin:limit||0,crop:crop||''});
  return{ok:true}}
function stopPump(reason,kind){
  if(!PUMP.on)return;
  S.irr.push({id:uid(),start:PUMP.since,minutes:PUMP.runMin,liters:PUMP.liters,source:PUMP.source,crop:PUMP.crop,result:kind==='safety'?'safety':'ok',note:reason});
  if(kind==='safety')addEvent('cmd','Irrigation arrêtée par sécurité','Remplir la réserve d’eau avant de relancer.','high',reason);
  PUMP.on=false;save();softRender()}

let tickN=0,lastSched='';
function checkSchedules(){
  const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),wd=d.getDay()||7;
  S.irrCfg.schedules.forEach(s=>{const key=s.id+d.toDateString()+hm;
    if(s.on&&s.time===hm&&s.days.includes(wd)&&lastSched!==key&&!PUMP.on){lastSched=key;
      const r=startPump('Programme',s.minutes);
      if(!r.ok)addEvent('cmd','Arrosage programmé non lancé',r.msg,'high');softRender()}})}
function tick(){
  if(!S||!S.session||!isSim())return;
  const r=Math.random;tickN++;
  if(L.conn.temp)L.temp=clamp(L.temp+(r()-.5)*.3,8,42);
  if(L.conn.hum)L.hum=clamp(L.hum+(r()-.5)*.8,20,99);
  if(PUMP.on){
    PUMP.runMin++;PUMP.liters+=4;L.soil=clamp(L.soil+1.2,0,100);L.water=clamp(L.water-.5,0,100);
    if(L.water<15||!L.conn.water)stopPump('Arrêt de sécurité : niveau d’eau insuffisant ou capteur absent','safety');
    else if(PUMP.limitMin&&PUMP.runMin>=PUMP.limitMin)stopPump('Durée atteinte','ok');
    else if(PUMP.source==='Automatique'&&L.soil>=S.irrCfg.high)stopPump('Seuil haut atteint','ok');
  }else{
    L.soil=clamp(L.soil-.08+(r()-.5)*.1,0,100);L.water=clamp(L.water-.005,0,100);
    if(S.irrCfg.auto&&!S.estop&&L.conn.soil&&L.soil<S.irrCfg.low&&L.water>=20&&allConn()){startPump('Automatique',0);softRender()}
    checkSchedules();
  }
  L.ts=Date.now();
  if(tickN%12===0){S.hist.push({ts:L.ts,soil:+L.soil.toFixed(1),temp:+L.temp.toFixed(1),hum:+L.hum.toFixed(1),water:+L.water.toFixed(1)});if(S.hist.length>1200)S.hist.splice(0,S.hist.length-1200);save()}
  updateLive();
}
const lv=k=>(isSim()&&L.conn[k])?L[k]:null;
function updateLive(){
  $$('[data-live]').forEach(el=>{const k=el.dataset.live;let v;
    if(k==='time')v=isSim()?fmtH(L.ts):'—';
    else if(k==='pumpMin')v=PUMP.runMin;else if(k==='pumpL')v=PUMP.liters;
    else{const x=lv(k);v=x==null?'—':(k==='temp'?tC(x):Math.round(x))}
    el.textContent=v});
  $$('[data-bar]').forEach(el=>{const x=lv(el.dataset.bar);el.style.width=(x==null?0:clamp(x,0,100))+'%'});
}
function softRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='')return;if(['dashboard','irrigation','sensors','alerts'].includes(UI.screen))render()}

async function commandPump(cmd,opts={}){
  if(UI.busy)return;UI.busy=true;render();
  await new Promise(r=>setTimeout(r,900));
  UI.busy=false;let res;
  if(!isSim())res={ok:false,msg:'Aucun matériel connecté : la commande n’a pas été envoyée.'};
  else if(cmd==='start')res=startPump('Manuel',opts.minutes,opts.crop);
  else if(!PUMP.on)res={ok:false,msg:'La pompe simulée est déjà à l’arrêt.'};
  else{stopPump('Arrêt manuel','ok');res={ok:true}}
  if(!res.ok){addEvent('cmd','Échec de la commande d’irrigation',res.msg,'high');toast(res.msg,true)}
  else toast(cmd==='start'?'Irrigation simulée démarrée. Aucune pompe réelle n’est commandée.':'Irrigation simulée arrêtée.');
  render();
}
function emergencyStop(){
  S.estop=true;if(PUMP.on){S.irr.push({id:uid(),start:PUMP.since,minutes:PUMP.runMin,liters:PUMP.liters,source:PUMP.source,crop:PUMP.crop,result:'safety',note:'Arrêt d’urgence'});PUMP.on=false}
  addEvent('cmd','Arrêt d’urgence activé','Relâcher l’arrêt d’urgence une fois le problème réglé.','high');save();toast('Arrêt d’urgence activé. Toutes les commandes sont bloquées.',true);render()}
function releaseEstop(){S.estop=false;save();toast('Arrêt d’urgence relâché.');render()}

/* alertes */
const PR={high:0,med:1,low:2},PRL={high:'Priorité haute',med:'Priorité moyenne',low:'Priorité basse'};
function computeAlerts(){
  const A=[],n=S.settings.notif,now=Date.now(),c=L.conn;
  const add=(key,type,prio,title,detail,action,ts)=>{if(n[type])A.push({key,type,prio,title,detail,action,ts:ts||now,read:!!S.read[key]})};
  if(isSim()){
    if(c.soil&&L.soil<30)add('soil-dry','soil','high','Sol trop sec','Humidité du sol à '+Math.round(L.soil)+' %.','Lancer une irrigation courte, puis vérifier l’humidité 30 minutes après.');
    if(c.water&&L.water<20)add('water-low','water','high','Niveau d’eau insuffisant','Réserve à '+Math.round(L.water)+' %. L’irrigation est bloquée sous 15 %.','Remplir la réserve avant la prochaine irrigation.');
    Object.keys(c).forEach(k=>{if(!c[k])add('conn-'+k,'sensor','med','Capteur déconnecté',LABEL[k]+' ne répond plus.','Vérifier l’alimentation et les câbles du capteur.')});
    if(c.temp&&(L.temp>34||L.temp<10))add('temp-odd','temp','med','Température inhabituelle','Température de l’air : '+tC(L.temp)+tU()+'.','Protéger les cultures sensibles (ombrage ou paillage).');
  }else add('no-sensor','sensor','med','Aucun capteur connecté','Le mode réel est actif mais aucune mesure n’est reçue.','Connecter l’ESP32 (voir l’écran Capteurs et données).');
  S.events.slice(0,25).forEach(e=>add('ev'+e.id,e.type,e.prio,e.title,e.detail,e.action,e.ts));
  return A.sort((a,b)=>PR[a.prio]-PR[b.prio]||b.ts-a.ts)}
const unread=()=>computeAlerts().filter(a=>!a.read).length;

/* composants */
let toastT=0;
function toast(msg,err){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.className='toast'+(err?' err':'');el.setAttribute('role','status');el.textContent=msg;el.hidden=false;toastT=setTimeout(()=>{el.hidden=true},3600)}
function openSheet(html){$('#layer').innerHTML=`<div class="sheet-bg" data-act="sheetbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeSheet(){$('#layer').innerHTML=''}
const pill=(txt,cls='')=>`<span class="pill ${cls}">${txt}</span>`;
const simPill=()=>isSim()?pill('Mode simulation','sim'):pill('Mode réel','info');
function topbar(title,right=''){return`<div class="topbar"><button class="iconbtn" data-act="back" aria-label="Retour">${ic('back')}</button><h1>${esc(title)}</h1>${right}</div>`}
function banner(txt,cls='',icon='alert'){return`<div class="banner ${cls}">${ic(icon)}<div>${txt}</div></div>`}
function simBanner(){return isSim()?banner('<b>Mode simulation.</b> Ces mesures sont fictives. Aucun capteur ni aucune pompe réels ne sont connectés.','sim'):''}
function field(id,label,type='text',val='',extra=''){return`<div class="field" id="f-${id}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(val)}" ${extra}><div class="errmsg" id="e-${id}" hidden></div></div>`}
function setErr(id,msg){const f=$('#f-'+id),e=$('#e-'+id);if(!f||!e)return;f.classList.toggle('err',!!msg);e.hidden=!msg;e.textContent=msg||''}
function sw(id,on,label){return`<label class="row between" style="margin:0;font-weight:500"><span>${label}</span><span class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><span></span></span></label>`}
function sample(a,max){if(a.length<=max)return a;const st=a.length/max,o=[];for(let i=0;i<max;i++)o.push(a[Math.floor(i*st)]);o[o.length-1]=a[a.length-1];return o}

function lineChart(o){
  const W=340,Hh=o.h||170,pl=36,pr=12,pt=12,pb=24;
  const all=o.series.flatMap(s=>s.vals.filter(v=>v!=null));
  if(all.length<2)return'<p class="muted small">Pas assez de mesures pour tracer un graphique.</p>';
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo||1)*.12;lo=o.min!=null?o.min:Math.floor(lo-pad);hi=o.max!=null?o.max:Math.ceil(hi+pad);
  const n=Math.max(...o.series.map(s=>s.vals.length));
  const X=i=>pl+(W-pl-pr)*(n<2?0:i/(n-1)),Y=v=>pt+(Hh-pt-pb)*(1-(v-lo)/(hi-lo||1));
  let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line);stroke-width:1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`}
  if(o.xl){[0,1/3,2/3,1].forEach((p,j)=>{const i=Math.round(p*(n-1));g+=`<text x="${X(i)}" y="${Hh-6}" text-anchor="${j===0?'start':j===3?'end':'middle'}">${esc(o.xl[i]||'')}</text>`})}
  o.series.forEach((s,si)=>{
    const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(si===0)g+=`<path d="${d} L${pts[pts.length-1][0]} ${Hh-pb} L${pts[0][0]} ${Hh-pb}Z" style="fill:${s.color};opacity:.12"/>`;
    g+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;${s.dash?'stroke-dasharray:5 4;opacity:.8':''}"/>`;
    const e=pts[pts.length-1];g+=`<circle cx="${e[0]}" cy="${e[1]}" r="4" style="fill:${s.color};stroke:var(--card);stroke-width:2"/>`});
  if(o.lines)o.lines.forEach(l=>{if(l.v>lo&&l.v<hi)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(l.v)}" y2="${Y(l.v)}" style="stroke:var(--err);stroke-dasharray:4 4;opacity:.7"/>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(o.label||'Graphique')}">${g}</svg>`}
const SER={soil:{l:'Humidité du sol',u:'%',c:'var(--c-soil)'},temp:{l:'Température',u:'',c:'var(--c-temp)'},hum:{l:'Humidité de l’air',u:'%',c:'var(--c-hum)'},water:{l:'Niveau d’eau',u:'%',c:'var(--c-water)'}};
function metric(k,icon){
  const x=lv(k),unit=k==='temp'?tU():'%';
  return`<div class="card metric"><div class="l">${ic(icon)}${t(k)}</div><div class="v"><span data-live="${k}">${x==null?'—':(k==='temp'?tC(x):Math.round(x))}</span><small>${unit}</small></div>${k==='temp'?'':`<div class="bar ${k==='water'?'water':''}"><i data-bar="${k}" style="width:${x==null?0:clamp(x,0,100)}%"></i></div>`}</div>`}
function emptyReal(){return`<div class="card tint stack8">${banner('<b>Aucune mesure réelle.</b> Le mode réel n’affiche rien tant qu’un capteur n’est pas connecté.','warn')}<button class="btn" data-go="sensors">Voir comment connecter l’ESP32</button></div>`}
</script>
<script>
/* ===== ÉCRANS 1 à 5 : splash, connexion, accueil, cultures, détail ===== */
const SCREENS={},ACT={},FORMS={};
const PARENT={dashboard:'dashboard',alerts:'dashboard',crops:'crops',cropdetail:'crops',sensors:'sensors',irrigation:'sensors',stats:'sensors',assistant:'assistant',photo:'assistant',profile:'profile'};

async function hashPw(pw,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return'weak'+h}}
function readImage(file,max=360){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* 1. Splash */
SCREENS.splash=()=>{
  const leaf=(x,y,r,s)=>`<svg class="leaf" style="left:${x};top:${y};width:${s}px;transform:rotate(${r}deg)" viewBox="0 0 80 80"><path d="M10 70C10 30 30 10 70 10 70 50 50 70 10 70z" fill="#81CD4B"/><path d="M10 70L50 30" stroke="#245C32" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
  return`<div class="splash">${leaf('-30px','4%',10,170)}${leaf('68%','62%',-120,200)}${leaf('55%','-3%',160,110)}
  ${logo(104)}<h1 style="font-size:40px;letter-spacing:.04em">TANTSAVA</h1><p class="muted" style="max-width:260px;font-size:16px">${t('slogan')}</p><span class="spin" aria-label="Chargement"></span></div>`};

/* 2. Connexion / inscription */
SCREENS.auth=()=>{
  const reg=UI.authMode==='register';
  return`<div class="stack" style="padding-top:24px"><div style="text-align:center" class="stack8">${logo(72)}<h1>${reg?'Créer un compte':'Se connecter'}</h1><p class="muted">${reg?'Quelques informations pour commencer.':'Content de vous revoir sur TANTSAVA.'}</p></div>
  <form class="stack" data-form="auth" novalidate>
   ${reg?field('name','Votre nom','text','','autocomplete="name"'):''}
   ${field('ident','Adresse e-mail ou téléphone','text','','autocomplete="username" inputmode="email"')}
   ${field('pw','Mot de passe','password','','autocomplete="'+(reg?'new':'current')+'-password"')}
   ${reg?field('pw2','Confirmer le mot de passe','password','','autocomplete="new-password"'):''}
   <button class="btn" type="submit">${reg?'Créer un compte':'Se connecter'}</button>
   <button class="btn ghost" type="button" data-act="authswitch">${reg?'J’ai déjà un compte':'Créer un compte'}</button>
   ${reg?'':'<button class="btn ghost" type="button" data-act="forgot" style="border:0;min-height:44px">Mot de passe oublié ?</button>'}
  </form>
  <button class="btn deep" data-act="demo">Essayer en mode démo</button>
  ${banner('Pour l’instant, le compte reste <b>uniquement sur cet appareil</b>. Une authentification sécurisée en ligne demande Firebase Authentication ou une API (identifiants du projet à fournir).','info','alert')}</div>`};
UI.authMode='login';
Object.assign(ACT,{
  authswitch(){UI.authMode=UI.authMode==='login'?'register':'login';render()},
  forgot(){openSheet(`<div class="stack"><h2>Mot de passe oublié</h2><p>L’envoi d’un e-mail ou d’un SMS de réinitialisation n’est pas encore possible : il faut un service d’authentification (Firebase Authentication ou une API avec envoi de messages).</p>${banner('Sur cet appareil, vous pouvez effacer les données locales depuis Profil, puis recréer un compte. Les cultures et mesures locales seront perdues.','warn')}<button class="btn" data-act="closesheet">Compris</button></div>`)},
  demo(){S.session=true;S.user={name:'Agriculteur démo',ident:'demo',demo:true};save();go('dashboard',{},false);toast('Mode démo activé. Toutes les données sont fictives.')},
  closesheet(){closeSheet()}});
FORMS.auth=async f=>{
  const reg=UI.authMode==='register',v=n=>(f.elements[n]?f.elements[n].value.trim():''),pw=f.elements.pw.value;let ok=true;
  const ident=v('ident'),isMail=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ident),isTel=/^\+?[0-9 ]{9,15}$/.test(ident);
  ['name','ident','pw','pw2'].forEach(n=>setErr(n,''));
  if(reg&&!v('name')){setErr('name','Indiquez votre nom.');ok=false}
  if(!ident){setErr('ident','Saisissez votre e-mail ou votre numéro de téléphone.');ok=false}
  else if(!isMail&&!isTel){setErr('ident','Format non reconnu. Exemple : nom@mail.com ou 034 12 345 67.');ok=false}
  if(pw.length<8){setErr('pw','Le mot de passe doit contenir au moins 8 caractères.');ok=false}
  if(reg&&pw!==f.elements.pw2.value){setErr('pw2','Les deux mots de passe ne sont pas identiques.');ok=false}
  if(!ok)return;
  const norm=ident.toLowerCase().replace(/\s/g,'');
  if(reg){const salt=uid()+uid();S.user={name:v('name'),ident:norm,salt,hash:await hashPw(pw,salt)};S.session=true;save();go('dashboard',{},false);toast('Compte créé sur cet appareil.')}
  else{
    if(!S.user||S.user.demo||S.user.ident!==norm){setErr('ident','Aucun compte trouvé avec cet identifiant sur cet appareil.');return}
    if(await hashPw(pw,S.user.salt)!==S.user.hash){setErr('pw','Mot de passe incorrect.');return}
    S.session=true;save();go('dashboard',{},false)}};

/* 3. Tableau de bord */
SCREENS.dashboard=()=>{
  const sim=isSim(),al=computeAlerts(),unr=al.filter(a=>!a.read).length;
  const area=S.crops.reduce((a,c)=>a+(+c.area||0),0);
  const since=Date.now()-DAY,hs=sample(getHist().filter(h=>h.ts>=since),60),k=UI.dashSeries;
  const pumpTxt=!sim?'Non connectée':PUMP.on?'En marche (simulée)':'À l’arrêt';
  const irrTxt=S.estop?'Bloquée (arrêt d’urgence)':!sim?'Indisponible':S.irrCfg.auto?'Automatique':'Manuel';
  return`<div class="stack">
  <div class="row between"><div class="grow"><p class="muted small">${t('hello')},</p><h1>${esc(S.user?S.user.name:'')}</h1></div>
   <button class="iconbtn" data-go="alerts" aria-label="Alertes">${ic('bell')}${unr?`<span class="badge">${unr}</span>`:''}</button></div>
  <div class="row wrap">${simPill()}${S.estop?pill('Arrêt d’urgence actif','err'):''}</div>
  <div class="card tint stack8"><h3>${esc(S.farm.name||'Mon exploitation')}</h3>
   <p class="small muted">${S.crops.length} culture${S.crops.length>1?'s':''} · ${areaTxt(area)}${S.farm.loc?' · '+esc(S.farm.loc):''}</p>

   <button class="btn ghost" data-go="crops">${ic('leaf')}Voir mes cultures</button></div>
  ${al.length?`<div class="stack8"><div class="row between"><h2>Alertes importantes</h2><button class="btn sm ghost" data-go="alerts">Tout voir</button></div>${al.slice(0,2).map(alertCard).join('')}</div>`:''}
  <div class="card stack8"><div class="row between"><h2>Dernières 24 h</h2>${simPill()}</div>
   <div class="chips">${Object.keys(SER).map(s=>`<button class="chip ${s===k?'on':''}" data-act="dser" data-k="${s}">${SER[s].l}</button>`).join('')}</div>
   ${sim?lineChart({series:[{vals:hs.map(h=>k==='temp'?tC(h[k]):h[k]),color:SER[k].c}],xl:hs.map(h=>fmtH(h.ts)),label:SER[k].l,min:k==='temp'?undefined:0,max:k==='temp'?undefined:100}):'<p class="muted small">Aucune donnée en mode réel tant qu’aucun capteur n’est connecté.</p>'}</div></div>`};
ACT.dser=el=>{UI.dashSeries=el.dataset.k;render()};
function alertCard(a){return`<div class="card alert ${a.prio} stack8" ${a.read?'style="opacity:.7"':''}>
 <div class="row between wrap"><b>${esc(a.title)}</b>${pill(PRL[a.prio],a.prio==='high'?'err':a.prio==='med'?'warn':'info')}</div>
 ${a.detail?`<p class="small">${esc(a.detail)}</p>`:''}<p class="small muted">${fmtDT(a.ts)} · ${ago(a.ts)}</p>
 <p class="small"><b>Action recommandée :</b> ${esc(a.action)}</p>
 ${a.read?'':`<button class="btn sm ghost" data-act="readalert" data-k="${esc(a.key)}">Marquer comme lue</button>`}</div>`}
ACT.readalert=el=>{S.read[el.dataset.k]=1;save();render()};

/* 4. Cultures */
SCREENS.crops=()=>{
  return`<div class="stack"><div class="row between"><h1>${t('crops')}</h1><button class="btn sm" data-act="cropform">${ic('plus')}Ajouter</button></div>
  ${S.crops.some(c=>c.demo)?banner('Les cultures marquées « Démo » sont des exemples. Vous pouvez les modifier ou les supprimer.','sim'):''}
  ${S.crops.length?S.crops.map(c=>`<div class="card link row" tabindex="0" role="button" data-go="cropdetail" data-id="${c.id}">

    <div class="grow stack8" style="gap:4px"><div class="row between"><b>${esc(c.name)}</b>${c.demo?pill('Démo','sim'):''}</div>

    <div class="row wrap">${pill(esc(c.stage))}${pill(esc(c.health),c.health==='Bon'?'':'warn')}<span class="tiny muted">${daysSince(c.plantDate)} j</span></div></div>${ic('chev')}</div>`).join('')
   :`<div class="card tint stack8" style="text-align:center"><h3>Aucune culture</h3><p class="muted">Ajoutez votre première culture pour suivre sa croissance et ses arrosages.</p><button class="btn" data-act="cropform">Ajouter une culture</button></div>`}</div>`};

function cropFormHtml(c){
  const e=!!c;c=c||{name:'',variety:'',plantDate:iso(Date.now()),area:'',water:'',stage:'Semis',photo:''};
  return`<form class="stack" data-form="crop" data-id="${e?c.id:''}" novalidate><div class="row between"><h2>${e?'Modifier la culture':'Nouvelle culture'}</h2><button type="button" class="iconbtn" data-act="closesheet" aria-label="Fermer">${ic('x')}</button></div>
  ${field('cname','Nom de la plante','text',c.name,'placeholder="Ex. Tomate"')}
  ${field('cvar','Variété (facultatif)','text',c.variety,'placeholder="Ex. Roma"')}
  ${field('cdate','Date de plantation','date',c.plantDate,'max="'+iso(Date.now())+'"')}
  ${field('carea','Surface cultivée (m²)','number',c.area,'min="1" step="any" inputmode="decimal"')}
  ${field('cwater','Besoin en eau (litres par m² et par jour)','number',c.water,'min="0" step="any" inputmode="decimal"')}
  <div class="field"><label for="cstage">Stade de croissance</label><select id="cstage">${STAGES.map(s=>`<option ${s===c.stage?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="field"><label for="cphoto">Photo de la plante (facultatif)</label><input id="cphoto" type="file" accept="image/*"></div>
  ${e?'':'<div class="field"><label for="cobs">Première observation (facultatif)</label><textarea id="cobs" placeholder="Ex. Semis en ligne, sol bien préparé."></textarea></div>'}
  <button class="btn" type="submit">${e?'Enregistrer':'Ajouter la culture'}</button></form>`}
ACT.cropform=el=>openSheet(cropFormHtml(el&&el.dataset.id?cropById(el.dataset.id):null));
FORMS.crop=async f=>{
  const g=id=>$('#'+id,f),id=f.dataset.id,name=g('cname').value.trim(),date=g('cdate').value,area=parseFloat(g('carea').value),water=parseFloat(g('cwater').value);let ok=true;
  ['cname','cdate','carea','cwater'].forEach(n=>setErr(n,''));
  if(!name){setErr('cname','Indiquez le nom de la plante.');ok=false}
  if(!date||new Date(date)>new Date()){setErr('cdate','Choisissez une date de plantation qui n’est pas dans le futur.');ok=false}
  if(!(area>0)){setErr('carea','Indiquez une surface supérieure à 0.');ok=false}
  if(!(water>=0)){setErr('cwater','Indiquez un besoin en eau (0 ou plus).');ok=false}
  if(!ok)return;
  let photo=null;const file=g('cphoto').files[0];
  if(file){try{photo=await readImage(file)}catch(e){toast('Cette image n’a pas pu être lue.',true);return}}
  let c=id?cropById(id):null;
  if(c){if(c.stage!==g('cstage').value)(c.log=c.log||[]).push({ts:Date.now(),text:'Stade : '+g('cstage').value});
    Object.assign(c,{name,variety:g('cvar').value.trim(),plantDate:date,area,water,stage:g('cstage').value});if(photo)c.photo=photo;c.demo=false}
  else{c={id:uid(),name,variety:g('cvar').value.trim(),plantDate:date,area,water,stage:g('cstage').value,health:'Bon',photo:photo||'',obs:[],log:[{ts:Date.now(),text:'Culture ajoutée'}]};
    const o=g('cobs').value.trim();if(o)c.obs.push({id:uid(),ts:Date.now(),text:o,health:'Bon'});S.crops.push(c)}
  save();closeSheet();toast(id?'Culture mise à jour.':'Culture ajoutée.');if(!id)go('cropdetail',{id:c.id});else render()};

/* 5. Détail d'une culture */
SCREENS.cropdetail=()=>{
  const c=cropById(UI.params.id);if(!c)return`<div class="stack">${topbar('Culture')}<p>Culture introuvable.</p></div>`;
  const tab=UI.cropTab,wat=getIrr().filter(i=>i.crop===c.id).sort((a,b)=>b.start-a.start);
  const tl=[...c.obs.map(o=>({ts:o.ts,t:'Observation',x:o.text+(o.health?' ('+o.health+')':'')})),...(c.log||[]).map(l=>({ts:l.ts,t:'Suivi',x:l.text})),...wat.map(w=>({ts:w.start,t:'Arrosage',x:w.minutes+' min · '+w.liters+' L'}))].sort((a,b)=>b.ts-a.ts);
  const last=[...c.obs].sort((a,b)=>b.ts-a.ts)[0];
  const body=tab==='infos'?`<div class="card stack8"><div class="row between"><span class="muted">Plantation</span><b>${fmtD(new Date(c.plantDate+'T00:00:00'))} (${daysSince(c.plantDate)} j)</b></div>
    <div class="row between"><span class="muted">Surface</span><b>${areaTxt(c.area)}</b></div><div class="row between"><span class="muted">Besoin en eau</span><b>${c.water} L/m²/jour</b></div>
    <div class="row between"><span class="muted">Eau estimée par jour</span><b>${Math.round(c.water*c.area)} L</b></div>
    <div class="field"><label for="stagesel">Stade de croissance</label><select id="stagesel" data-change="stage">${STAGES.map(s=>`<option ${s===c.stage?'selected':''}>${s}</option>`).join('')}</select></div></div>
   <div class="card stack8"><div class="row between"><h3>État de santé observé</h3>${pill(esc(c.health),c.health==='Bon'?'':'warn')}</div>
    <p class="small">${last?'Dernière observation ('+fmtD(last.ts)+') : '+esc(last.text):'Aucune observation pour le moment.'}</p></div>
   <div class="card stack8"><h3>Conseils pour ${esc(c.name.toLowerCase())}</h3><ul style="margin:0;padding-left:18px" class="stack8">${tipsFor(c.name).map(x=>`<li>${x}</li>`).join('')}</ul><p class="tiny muted">Conseils généraux. Adaptez-les à votre sol, votre climat et la saison.</p></div>`
  :tab==='water'?`<div class="card">${wat.length?`<div class="scroll-x"><table class="t"><tr><th>Date</th><th>Durée</th><th>Eau</th><th>Origine</th></tr>${wat.slice(0,30).map(w=>`<tr><td>${fmtDT(w.start)}</td><td>${w.minutes} min</td><td>${w.liters} L</td><td>${esc(w.source)}${isSim()?' (simulé)':''}</td></tr>`).join('')}</table></div>`:'<p class="muted">Aucun arrosage enregistré pour cette culture.</p>'}</div>
   <button class="btn" data-go="irrigation" data-crop="${c.id}">${ic('drop')}Arroser cette culture</button>`
  :`<div class="card">${tl.length?`<div class="list">${tl.slice(0,40).map(e=>`<div class="li"><div class="grow"><div class="row between"><b>${e.t}</b><span class="tiny muted">${fmtD(e.ts)}</span></div><p class="small">${esc(e.x)}</p></div></div>`).join('')}</div>`:'<p class="muted">L’historique est vide.</p>'}</div>`;
  return`<div class="stack">${topbar(c.name,`<button class="iconbtn" data-act="cropform" data-id="${c.id}" aria-label="Modifier">${ic('gear')}</button>`)}
  <div class="thumb big">${c.photo?`<img src="${c.photo}" alt="Photo de ${esc(c.name)}">`:ic('sprout')}</div>
  <div class="row wrap"><h2>${esc(c.name)}${c.variety?' · '+esc(c.variety):''}</h2>${c.demo?pill('Démo','sim'):''}</div>
  <div class="chips">${[['infos','Infos'],['water','Arrosages'],['hist','Historique']].map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-act="ctab" data-k="${k}">${l}</button>`).join('')}</div>
  ${body}
  <div class="grid2"><button class="btn ghost" data-act="obsform" data-id="${c.id}">Ajouter une observation</button><button class="btn ghost" data-go="photo" data-id="${c.id}">${ic('camera')}Analyser une photo</button></div>
  <button class="btn ghost" data-act="cropdel" data-id="${c.id}" style="color:var(--err)">Supprimer cette culture</button></div>`};
Object.assign(ACT,{
  ctab(el){UI.cropTab=el.dataset.k;render()},
  obsform(el){const id=el.dataset.id;openSheet(`<form class="stack" data-form="obs" data-id="${id}" novalidate><div class="row between"><h2>Nouvelle observation</h2><button type="button" class="iconbtn" data-act="closesheet" aria-label="Fermer">${ic('x')}</button></div>
    <div class="field" id="f-otext"><label for="otext">Ce que vous observez</label><textarea id="otext" placeholder="Ex. Feuilles basses jaunies, sol sec sur 3 cm."></textarea><div class="errmsg" id="e-otext" hidden></div></div>
    <div class="field"><label for="ohealth">État de santé</label><select id="ohealth"><option>Bon</option><option>À surveiller</option><option>Préoccupant</option></select></div><button class="btn" type="submit">Enregistrer</button></form>`)},
  cropdel(el){const c=cropById(el.dataset.id);openSheet(`<div class="stack"><h2>Supprimer ${esc(c.name)} ?</h2><p>L’historique de cette culture sera effacé de cet appareil. Cette action est définitive.</p><button class="btn danger" data-act="cropdel2" data-id="${c.id}">Supprimer</button><button class="btn ghost" data-act="closesheet">Annuler</button></div>`)},
  cropdel2(el){S.crops=S.crops.filter(c=>c.id!==el.dataset.id);save();closeSheet();toast('Culture supprimée.');go('crops',{},false)}});
FORMS.obs=f=>{const c=cropById(f.dataset.id),txt=$('#otext',f).value.trim(),h=$('#ohealth',f).value;
  if(!txt){setErr('otext','Décrivez brièvement ce que vous voyez.');return}
  c.obs.push({id:uid(),ts:Date.now(),text:txt,health:h});c.health=h;
  if(h==='Préoccupant')addEvent('plant','Observation préoccupante : '+c.name,'Photographier la plante et demander l’avis d’un technicien agricole.','high',txt);
  save();closeSheet();toast('Observation enregistrée.');render()};
</script>
<script>
/* ===== ÉCRANS 6 à 9 : capteurs, irrigation, statistiques, alertes ===== */
const CHG={},INP={};

/* 6. Capteurs et données */
SCREENS.sensors=()=>{
  const sim=isSim(),keys=['soil','temp','hum','water'],ico={soil:'leaf',temp:'thermo',hum:'cloud',water:'drop'};
  return`<div class="stack"><h1>Capteurs et données</h1>
  <div class="chips"><button class="chip ${sim?'on':''}" data-act="mode" data-k="sim">Simulation</button><button class="chip ${sim?'':'on'}" data-act="mode" data-k="real">Mode réel</button></div>
  ${sim?simBanner():banner('<b>Mode réel.</b> Aucune mesure n’est affichée tant qu’un capteur n’envoie pas de données vérifiées.','warn')}
  <div class="card"><div class="list">${keys.map(k=>{const x=lv(k),conn=sim&&L.conn[k];
    return`<div class="li">${ic(ico[k])}<div class="grow"><b>${t(k)}</b><p class="tiny muted">${conn?'Mesure à <span data-live="time">'+fmtH(L.ts)+'</span>':'Aucune mesure reçue'}</p></div>
    <div style="text-align:right"><b class="num"><span data-live="${k}">${x==null?'—':(k==='temp'?tC(x):Math.round(x))}</span>${x==null?'':(k==='temp'?tU():' %')}</b><br>${conn?pill('<span class="dot"></span>Connecté'):pill('<span class="dot"></span>Déconnecté','err')}</div></div>`}).join('')}</div></div>
  ${sim?`<div class="card stack8"><h3>Tester une panne (simulation)</h3><p class="small muted">Déconnecte un capteur fictif pour voir les alertes et les protections.</p><div class="chips">${keys.map(k=>`<button class="chip ${L.conn[k]?'':'on'}" data-act="fail" data-k="${k}">${L.conn[k]?'Couper':'Rétablir'} : ${t(k).replace('Humidité de l’air','Air')}</button>`).join('')}</div></div>`:setupCard()}
  <div class="stack8"><button class="card link row" data-go="irrigation" style="text-align:left;font:inherit;color:inherit">${ic('drop')}<div class="grow"><b>Irrigation intelligente</b><p class="small muted">Pompe, seuils, programmes</p></div>${ic('chev')}</button>
  <button class="card link row" data-go="stats" style="text-align:left;font:inherit;color:inherit">${ic('chart')}<div class="grow"><b>Historique et statistiques</b><p class="small muted">Graphiques, comparaisons, filtres</p></div>${ic('chev')}</button>
  <button class="card link row" data-go="alerts" style="text-align:left;font:inherit;color:inherit">${ic('bell')}<div class="grow"><b>Alertes</b><p class="small muted">${unread()} non lue(s)</p></div>${ic('chev')}</button></div></div>`};
function setupCard(){return`<div class="card stack8"><h3>Ce qu’il faut pour passer en réel</h3>
  <ul class="stack8 small" style="margin:0;padding-left:18px"><li><b>Matériel :</b> carte ESP32, capteur capacitif d’humidité du sol, capteur de température et d’humidité de l’air (DHT22 ou SHT31), capteur de niveau d’eau, module de commande de pompe adapté (relais optocouplé ou MOSFET avec diode de protection, alimentation séparée).</li>
  <li><b>Service de données :</b> un projet Firebase (ou une API) avec ses identifiants, que l’application n’a pas encore.</li>
  <li><b>Programme de l’ESP32 :</b> envoi des mesures et réception des commandes avec confirmation.</li></ul>
  ${banner('Ne branchez jamais une pompe directement sur une broche de l’ESP32. L’ESP32 doit couper la pompe seul si le niveau d’eau est bas ou si le Wi-Fi tombe.','err')}</div>`}
Object.assign(ACT,{
  mode(el){const m=el.dataset.k;if(m===S.settings.mode)return;S.settings.mode=m;save();toast(m==='sim'?'Mode simulation activé. Données fictives.':'Mode réel activé. Aucune donnée tant que le matériel n’est pas connecté.');render()},
  fail(el){const k=el.dataset.k;L.conn[k]=!L.conn[k];render()}});

/* 7. Irrigation */
SCREENS.irrigation=()=>{
  const sim=isSim(),cfg=S.irrCfg,wl=lv('water'),todayL=getIrr().filter(i=>i.start>new Date().setHours(0,0,0,0)).reduce((a,i)=>a+i.liters,0)+(PUMP.on?PUMP.liters:0);
  const crop=UI.params.crop||'';
  const pumpTxt=!sim?'Non connectée':S.estop?'Bloquée':PUMP.on?'En marche (simulée)':'À l’arrêt';
  return`<div class="stack">${topbar('Irrigation intelligente',simPill())}
  ${sim?banner('<b>Pompe simulée.</b> Aucune vraie pompe n’est commandée. Les commandes sont confirmées par la simulation, pas par du matériel.','sim'):banner('<b>Aucun matériel connecté.</b> Les commandes sont refusées et rien n’est envoyé.','warn')}
  ${wl!=null&&wl<20?banner('<b>Niveau d’eau insuffisant ('+Math.round(wl)+' %).</b> Remplissez la réserve. Le démarrage est bloqué sous 15 %.','err'):''}
  <div class="card stack8"><div class="row between"><h3>Pompe</h3><b>${pumpTxt}</b></div>
   <div class="row between"><span class="muted">Durée de l’irrigation en cours</span><b class="num"><span data-live="pumpMin">${PUMP.on?PUMP.runMin:0}</span> min</b></div>
   <div class="row between"><span class="muted">Eau utilisée (${sim?'simulée':'mesurée'})</span><b class="num"><span data-live="pumpL">${PUMP.on?PUMP.liters:0}</span> L</b></div>
   <div class="row between"><span class="muted">Eau aujourd’hui</span><b class="num">${sim?todayL+' L':'Non mesurée'}</b></div>
   <div class="row between"><span class="muted">Niveau d’eau</span><b class="num"><span data-live="water">${wl==null?'—':Math.round(wl)}</span> %</b></div></div>
  <div class="card stack"><div class="field"><label for="dur">Durée</label><select id="dur">${[5,10,15,20,30].map(m=>`<option value="${m}" ${m===10?'selected':''}>${m} minutes (${m*4} L simulés)</option>`).join('')}</select></div>
   <div class="field"><label for="icrop">Culture arrosée (facultatif)</label><select id="icrop"><option value="">Toute l’exploitation</option>${S.crops.map(c=>`<option value="${c.id}" ${c.id===crop?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
   <div class="grid2"><button class="btn" data-act="pstart" ${UI.busy||PUMP.on||S.estop?'disabled':''}>${UI.busy?'<span class="spin"></span>':ic('drop')}Démarrer</button>
   <button class="btn ghost" data-act="pstop" ${UI.busy||!PUMP.on?'disabled':''}>${ic('power')}Arrêter</button></div>
   ${S.estop?`<button class="btn deep" data-act="release">Relâcher l’arrêt d’urgence</button>`:`<button class="btn danger" data-act="estop">${ic('alert')}Arrêt d’urgence</button>`}
   <p class="tiny muted">L’arrêt d’urgence de l’application bloque toutes les commandes. Sur une installation réelle, prévoyez aussi un interrupteur physique qui coupe l’alimentation de la pompe.</p></div>
  <div class="card stack"><div class="row between"><div><h3>Mode automatique</h3><p class="small muted">Démarre sous le seuil bas, s’arrête au seuil haut.</p></div><span class="sw"><input type="checkbox" id="auto" data-change="auto" ${cfg.auto?'checked':''} aria-label="Mode automatique"><span></span></span></div>
   <div class="field"><label for="low">Seuil bas d’humidité : <b><span id="lowv">${cfg.low}</span> %</b></label><input id="low" type="range" min="10" max="70" value="${cfg.low}" data-input="low" data-change="low"></div>
   <div class="field"><label for="high">Seuil haut d’humidité : <b><span id="highv">${cfg.high}</span> %</b></label><input id="high" type="range" min="30" max="90" value="${cfg.high}" data-input="high" data-change="high"></div>
   <div class="errmsg" id="e-thr" hidden></div></div>
  <div class="card stack"><div class="row between"><h3>Arrosages programmés</h3></div>
   ${cfg.schedules.length?`<div class="list">${cfg.schedules.map(s=>`<div class="li"><div class="grow"><b class="num">${s.time}</b> · ${s.minutes} min<p class="tiny muted">${s.days.length===7?'Tous les jours':s.days.map(d=>'LMMJVSD'[d-1]).join(' ')}</p></div><span class="sw"><input type="checkbox" data-change="sched" data-id="${s.id}" ${s.on?'checked':''} aria-label="Activer ${s.time}"><span></span></span><button class="iconbtn" data-act="schedel" data-id="${s.id}" aria-label="Supprimer">${ic('x')}</button></div>`).join('')}</div>`:'<p class="muted small">Aucun programme.</p>'}
   <form class="stack" data-form="sched" novalidate><div class="grid2"><div class="field" id="f-stime"><label for="stime">Heure</label><input id="stime" type="time" value="06:00"></div><div class="field" id="f-smin"><label for="smin">Durée (min)</label><input id="smin" type="number" min="1" max="60" value="10" inputmode="numeric"></div></div>
   <div class="errmsg" id="e-stime" hidden></div><div class="errmsg" id="e-smin" hidden></div>
   <div class="chips">${[1,2,3,4,5,6,7].map(d=>`<label class="chip" style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" class="sd" value="${d}" checked style="width:18px;height:18px;min-height:0">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][d-1]}</label>`).join('')}</div>
   <button class="btn ghost" type="submit">${ic('plus')}Ajouter un programme</button></form></div>
  <div class="card tint stack8"><h3>Protections prévues</h3><ul class="small stack8" style="margin:0;padding-left:18px"><li>Démarrage refusé si le niveau d’eau est sous 15 % ou si son capteur est déconnecté.</li><li>Arrêt automatique de la pompe si l’eau devient insuffisante en cours d’arrosage.</li><li>Une réussite n’est affichée qu’après confirmation de la commande.</li><li>Sur le matériel, ces protections doivent aussi tourner dans l’ESP32, sans Wi-Fi.</li></ul></div></div>`};
Object.assign(ACT,{
  pstart(){commandPump('start',{minutes:+$('#dur').value,crop:$('#icrop').value})},
  pstop(){commandPump('stop')},estop(){emergencyStop()},release(){releaseEstop()},
  schedel(el){S.irrCfg.schedules=S.irrCfg.schedules.filter(s=>s.id!==el.dataset.id);save();render();toast('Programme supprimé.')}});
INP.low=el=>{$('#lowv').textContent=el.value};INP.high=el=>{$('#highv').textContent=el.value};
function setThr(){const lo=+$('#low').value,hi=+$('#high').value,e=$('#e-thr');
  if(hi-lo<10){e.hidden=false;e.textContent='Le seuil haut doit dépasser le seuil bas d’au moins 10 points. Valeurs non enregistrées.';return}
  e.hidden=true;S.irrCfg.low=lo;S.irrCfg.high=hi;save();toast('Seuils enregistrés.')}
CHG.low=setThr;CHG.high=setThr;
CHG.auto=el=>{if(el.checked&&!isSim()){el.checked=false;toast('Mode automatique impossible : aucun matériel connecté.',true);return}S.irrCfg.auto=el.checked;save();toast(el.checked?'Mode automatique activé.':'Mode automatique désactivé.')};
CHG.sched=el=>{const s=S.irrCfg.schedules.find(x=>x.id===el.dataset.id);s.on=el.checked;save()};
FORMS.sched=f=>{const time=$('#stime',f).value,m=parseInt($('#smin',f).value,10),days=$$('.sd:checked',f).map(x=>+x.value);let ok=true;setErr('stime','');setErr('smin','');

/* 8. Historique et statistiques */
function statWin(){
  const day=UI.statsDay;
  if(day){const from=new Date(day+'T00:00:00').getTime();return{from,to:from+DAY,pf:from-DAY,pt:from,label:'ce jour'}}
  const h={'24h':24,'3j':72,'7j':168}[UI.statsRange],to=Date.now(),from=to-h*H;return{from,to,pf:from-h*H,pt:from,label:UI.statsRange}}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
SCREENS.stats=()=>{
  const w=statWin(),H0=getHist(),cur=H0.filter(h=>h.ts>=w.from&&h.ts<w.to),prev=H0.filter(h=>h.ts>=w.pf&&h.ts<w.pt),tab=UI.statsTab;
  const irr=getIrr().filter(i=>i.start>=w.from&&i.start<w.to&&(UI.statsCrop==='all'||i.crop===UI.statsCrop)).sort((a,b)=>b.start-a.start);
  const pirr=getIrr().filter(i=>i.start>=w.pf&&i.start<w.pt&&(UI.statsCrop==='all'||i.crop===UI.statsCrop));
  const s=sample(cur,70),xl=s.map(h=>w.to-w.from>DAY*1.5?new Date(h.ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):fmtH(h.ts));
  const sum=a=>a.reduce((x,i)=>x+i.liters,0);
  const delta=(a,b,u)=>a==null||b==null?'<span class="muted">Pas de période précédente</span>':`<b>${(a-b>=0?'+':'')+(a-b).toFixed(1)} ${u}</b>`;
  let body='';
  if(!isSim()&&!cur.length)body=emptyReal();
  else if(tab==='sol')body=`<div class="card stack8"><h3>Humidité du sol (%)</h3>${lineChart({series:[{vals:s.map(h=>h.soil),color:'var(--c-soil)'}],xl,min:0,max:100,label:'Humidité du sol',lines:[{v:S.irrCfg.low}]})}<p class="tiny muted">Ligne rouge : seuil bas d’irrigation (${S.irrCfg.low} %).</p></div>`;
  else if(tab==='temp')body=`<div class="card stack8"><h3>Température de l’air (${tU()})</h3>${lineChart({series:[{vals:s.map(h=>tC(h.temp)),color:'var(--c-temp)'}],xl,label:'Température'})}</div><div class="card stack8"><h3>Humidité de l’air (%)</h3>${lineChart({series:[{vals:s.map(h=>h.hum),color:'var(--c-hum)'}],xl,min:0,max:100,label:'Humidité de l’air'})}</div>`;
  else if(tab==='eau'){const by={};irr.forEach(i=>{const d=new Date(i.start).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit'});by[d]=(by[d]||0)+i.liters});const mx=Math.max(1,...Object.values(by));
    body=`<div class="card stack8"><div class="row between"><h3>Consommation d’eau</h3><b class="num">${sum(irr)} L</b></div>${isSim()?'<p class="tiny muted">Volumes simulés (4 L par minute de pompe).</p>':''}${Object.keys(by).length?Object.entries(by).map(([d,l])=>`<div class="row"><span class="small" style="width:70px">${d}</span><div class="bar grow"><i style="width:${l/mx*100}%;background:var(--c-water)"></i></div><span class="small num" style="width:52px;text-align:right">${l} L</span></div>`).join(''):'<p class="muted small">Aucune irrigation sur cette période.</p>'}</div>
    <div class="card"><h3 style="margin-bottom:8px">Historique des irrigations</h3>${irr.length?`<div class="scroll-x"><table class="t"><tr><th>Début</th><th>Durée</th><th>Eau</th><th>Culture</th><th>Résultat</th></tr>${irr.slice(0,25).map(i=>`<tr><td>${fmtDT(i.start)}</td><td>${i.minutes} min</td><td>${i.liters} L</td><td>${i.crop&&cropById(i.crop)?esc(cropById(i.crop).name):'Toutes'}</td><td>${i.result==='safety'?pill('Arrêt sécurité','err'):pill('Terminée')}</td></tr>`).join('')}</table></div>`:'<p class="muted small">Aucune irrigation.</p>'}</div>`}
  else body=`<div class="card stack8"><h3>Comparaison avec la période précédente</h3>${prev.length?`
    <div class="scroll-x"><table class="t"><tr><th></th><th>Cette période</th><th>Précédente</th><th>Écart</th></tr>
    <tr><td>Sol moyen</td><td>${avg(cur.map(h=>h.soil))?.toFixed(1)} %</td><td>${avg(prev.map(h=>h.soil))?.toFixed(1)} %</td><td>${delta(avg(cur.map(h=>h.soil)),avg(prev.map(h=>h.soil)),'pt')}</td></tr>
    <tr><td>Température moy.</td><td>${tC(avg(cur.map(h=>h.temp)))} ${tU()}</td><td>${tC(avg(prev.map(h=>h.temp)))} ${tU()}</td><td>${delta(avg(cur.map(h=>h.temp)),avg(prev.map(h=>h.temp)),'°')}</td></tr>
    <tr><td>Eau utilisée</td><td>${sum(irr)} L</td><td>${sum(pirr)} L</td><td>${(sum(irr)-sum(pirr)>=0?'+':'')+(sum(irr)-sum(pirr))} L</td></tr></table></div>
    ${lineChart({series:[{vals:sample(cur,50).map(h=>h.soil),color:'var(--c-soil)'},{vals:sample(prev,50).map(h=>h.soil),color:'var(--fg2)',dash:1}],min:0,max:100,label:'Humidité du sol, période actuelle et précédente'})}<div class="legend"><span><i style="background:var(--c-soil)"></i>Cette période</span><span><i style="background:var(--fg2)"></i>Précédente</span></div>`
    :'<p class="muted small">Pas assez de données avant cette période pour comparer. Essayez 24 h ou 3 jours.</p>'}</div>`;
  const rows=cur.slice(-8).reverse();
  return`<div class="stack">${topbar('Historique et statistiques',simPill())}
  <div class="chips">${[['24h','24 h'],['3j','3 jours'],['7j','7 jours']].map(([k,l])=>`<button class="chip ${!UI.statsDay&&UI.statsRange===k?'on':''}" data-act="srange" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="grid2"><div class="field"><label for="sday">Jour précis</label><input id="sday" type="date" value="${UI.statsDay||''}" max="${iso(Date.now())}" data-change="sday"></div>
  <div class="field"><label for="scrop">Culture</label><select id="scrop" data-change="scrop"><option value="all">Toutes</option>${S.crops.map(c=>`<option value="${c.id}" ${UI.statsCrop===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  ${UI.statsCrop!=='all'?'<p class="tiny muted">Le filtre par culture s’applique aux irrigations. Les capteurs mesurent l’ensemble de l’exploitation.</p>':''}
  <div class="chips">${[['sol','Sol'],['temp','Température'],['eau','Eau'],['cmp','Comparer']].map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-act="stab" data-k="${k}">${l}</button>`).join('')}</div>
  ${body}
  ${tab!=='eau'&&cur.length?`<div class="card"><h3 style="margin-bottom:8px">Dernières mesures</h3><div class="scroll-x"><table class="t"><tr><th>Heure</th><th>Sol</th><th>Temp.</th><th>Air</th><th>Eau</th></tr>${rows.map(h=>`<tr><td>${fmtDT(h.ts)}</td><td>${h.soil} %</td><td>${tC(h.temp)} ${tU()}</td><td>${h.hum} %</td><td>${h.water} %</td></tr>`).join('')}</table></div></div>`:''}</div>`};
Object.assign(ACT,{srange(el){UI.statsRange=el.dataset.k;UI.statsDay='';render()},stab(el){UI.statsTab=el.dataset.k;render()}});
CHG.sday=el=>{UI.statsDay=el.value;render()};CHG.scrop=el=>{UI.statsCrop=el.value;render()};

/* 9. Alertes */
